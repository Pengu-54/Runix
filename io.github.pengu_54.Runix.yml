app-id: io.github.pengu_54.Runix
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.11'
command: runix

build-options:
  env:
    - BASEAPP_REMOVE_WEBENGINE=1

cleanup-commands:
  - /app/cleanup-BaseApp.sh

finish-args:
  - --talk-name=org.freedesktop.Flatpak
  - --filesystem=host
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri

modules:
  - name: runix
    buildsystem: simple
    build-commands:
      - install -Dm755 Runix.py /app/bin/Runix.py
      - install -Dm755 Runixui.py /app/bin/Runixui.py
      - install -Dm755 runixsetting.py /app/bin/runixsetting.py
      - install -Dm755 runixsettingui.py /app/bin/runixsettingui.py
      - install -Dm755 runix-launcher.sh /app/bin/runix
      - install -Dm644 io.github.pengu_54.Runix.desktop /app/share/applications/io.github.pengu_54.Runix.desktop
      - install -Dm644 io.github.pengu_54.Runix.metainfo.xml /app/share/metainfo/io.github.pengu_54.Runix.metainfo.xml
      - install -Dm644 io.github.pengu_54.Runix.svg /app/share/icons/hicolor/scalable/apps/io.github.pengu_54.Runix.svg
    sources:
      - type: dir
        path: .
